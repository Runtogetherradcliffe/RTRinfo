    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.7;
            font-weight: 300;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 0;
        }

        .back-link {
            color: #555;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin-bottom: 1.5rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: #f5a623; }

        h1 {
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 0.4rem;
        }

        .tagline { color: #888; font-size: 0.95rem; margin-bottom: 2.5rem; }

        a { color: #f5a623; text-decoration: none; transition: color 0.2s; }
        a:hover { color: #ffc966; }

        /* Search */
        .search-bar { position: relative; margin-bottom: 1rem; }
        .search-bar input {
            width: 100%;
            background: #111;
            border: 1px solid #2a2a2a;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 300;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar input:focus { border-color: #f5a623; }
        .search-bar input::placeholder { color: #555; }
        .search-icon {
            position: absolute; left: 0.85rem; top: 50%;
            transform: translateY(-50%); color: #555; pointer-events: none;
        }

        /* Filter tabs */
        .filter-tabs {
            display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.75rem;
        }
        .tab {
            background: #111; border: 1px solid #2a2a2a; color: #888;
            padding: 0.4rem 0.9rem; border-radius: 20px; cursor: pointer;
            font-family: inherit; font-size: 0.85rem; transition: all 0.2s;
        }
        .tab:hover { border-color: #555; color: #ccc; }
        .tab.active {
            background: #f5a623; border-color: #f5a623;
            color: #0a0a0a; font-weight: 500;
        }

        .count-label {
            color: #555; font-size: 0.82rem; margin-bottom: 0.75rem;
        }

        /* Route cards */
        .routes-grid { display: grid; gap: 0.55rem; }

        .route-card {
            background: #111; border: 1px solid #1a1a1a; border-radius: 8px;
            padding: 0.875rem 1.25rem; display: flex;
            justify-content: space-between; align-items: center;
            gap: 1rem; transition: all 0.2s; cursor: pointer;
        }
        .route-card:hover { border-color: #333; background: #151515; }
        .route-card.active {
            border-color: #f5a623;
            background: linear-gradient(135deg, #1a1510 0%, #111 100%);
        }

        .route-info { flex: 1; min-width: 0; }
        .route-name {
            font-weight: 400; color: #fff; font-size: 0.95rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .route-meta { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.25rem; }

        .category-badge {
            font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 10px;
            font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em;
        }
        .badge-road-5k { background: #0d1221; color: #6b9fd4; border: 1px solid #1a2a44; }
        .badge-road-8k { background: #0d1221; color: #5888c0; border: 1px solid #1a2a44; }
        .badge-trail-5k { background: #0d1a0d; color: #7cb87c; border: 1px solid #1a3a1a; }
        .badge-trail-8k { background: #0d1a0d; color: #5aaa5a; border: 1px solid #1a3a1a; }

        .view-btn {
            background: transparent; border: 1px solid #2a2a2a; color: #f5a623;
            padding: 0.35rem 0.875rem; border-radius: 6px; cursor: pointer;
            font-family: inherit; font-size: 0.82rem; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
        }
        .view-btn:hover { border-color: #f5a623; background: #1a1510; }
        .route-card.active .view-btn { border-color: #f5a623; background: #1a1510; }

        .no-results { text-align: center; color: #555; padding: 3rem 0; font-size: 0.95rem; }

        /* Map overlay */
        .map-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.82);
            z-index: 1000; display: flex; align-items: flex-end;
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
        }
        .map-overlay.open { opacity: 1; pointer-events: all; }

        .map-panel {
            background: #111; width: 100%; max-width: 860px; margin: 0 auto;
            border-radius: 16px 16px 0 0; overflow: hidden;
            display: flex; flex-direction: column; max-height: 90vh;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -8px 40px rgba(0,0,0,0.6);
        }
        .map-overlay.open .map-panel { transform: translateY(0); }

        .panel-handle {
            width: 36px; height: 4px; background: #2a2a2a;
            border-radius: 2px; margin: 0.75rem auto 0; flex-shrink: 0;
        }

        .map-header {
            padding: 0.75rem 1.25rem 0.875rem; display: flex;
            justify-content: space-between; align-items: flex-start;
            border-bottom: 1px solid #1a1a1a; flex-shrink: 0;
        }
        .map-header-info h3 {
            font-size: 1.05rem; font-weight: 500; color: #fff; margin-bottom: 0.2rem;
        }
        .map-header-meta { display: flex; gap: 0.5rem; align-items: center; }

        .close-btn {
            background: #1a1a1a; border: 1px solid #2a2a2a; color: #888;
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
            font-size: 1.2rem; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0;
            transition: all 0.2s; margin-left: 1rem; line-height: 1;
        }
        .close-btn:hover { border-color: #f5a623; color: #f5a623; }

        #map-container { flex: 1; position: relative; min-height: 280px; }

        .map-loading {
            position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center;
            background: #0d0d0d; color: #555; font-size: 0.9rem; z-index: 10;
        }

        #map { width: 100%; height: 100%; min-height: 280px; }

        .map-footer {
            padding: 0.75rem 1.25rem; border-top: 1px solid #1a1a1a;
            display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap;
            flex-shrink: 0;
        }
        .stat { font-size: 0.85rem; color: #888; }
        .stat strong { color: #fff; font-weight: 500; }

        .share-btn {
            margin-left: auto; font-size: 0.82rem; color: #555;
            cursor: pointer; transition: color 0.2s; user-select: none;
            display: flex; align-items: center; gap: 0.3rem;
            background: none; border: none; font-family: inherit; padding: 0;
        }
        .share-btn:hover { color: #f5a623; }
        .share-btn.copied { color: #7cb87c; }

        footer {
            text-align: center; padding-top: 2rem; margin-top: 3rem;
            border-top: 1px solid #1a1a1a; color: #555; font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            body { padding: 1rem; }
            h1 { font-size: 1.5rem; }
            .route-card { padding: 0.75rem 1rem; }
            .map-panel { max-height: 92vh; }
        }

        /* Subtle dark map tiles */
        .leaflet-tile-pane { filter: brightness(0.88) saturate(0.85); }
        .leaflet-container { background: #1a1a1a !important; }
    </style>

    <div class="container">

            <h1>Route Library</h1>
            <p class="tagline">63 routes across road and trail &mdash; tap any to view the map</p>

            </svg>
            <input type="text" id="search" placeholder="Search routes&hellip;" autocomplete="off" autocorrect="off" spellcheck="false">
        </div>

        <div class="filter-tabs">
            <button class="tab active" data-filter="all">All</button>
            <button class="tab" data-filter="road-5k">Road 5k</button>
            <button class="tab" data-filter="road-8k">Road 8k</button>
            <button class="tab" data-filter="trail-5k">Trail 5k</button>

        <div class="routes-grid" id="routes-grid"></div>
        <div class="no-results" id="no-results" style="display:none;">No routes match your search.</div>

        <footer>
            <p>Run Together Radcliffe &mdash; Part of the <a href="https://runtogether.co.uk" target="_blank" rel="noopener">England Athletics Run Together</a> programme</p>
        </footer>
    </div>

    <!-- Map panel -->
    <div class="map-overlay" id="map-overlay">

                </div>
                <button class="close-btn" id="close-btn" aria-label="Close">&#x2715;</button>
            </div>
            <div id="map-container">
                <div class="map-loading" id="map-loading">Loading map&hellip;</div>
                <div id="map"></div>
            </div>
            <div class="map-footer">
                <div class="stat"><strong id="stat-distance">&mdash;</strong>&nbsp;distance</div>
                <div class="stat"><strong id="stat-elevation">&mdash;</strong>&nbsp;elevation gain</div>
                <button class="share-btn" id="share-btn" onclick="copyLink()">

                        <polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
                    </svg>
                    Copy link
                </button>
            </div>
        </div>
    </div>

    let map = null;
    let activeRouteId = null;

    // ---- Render ----
    function renderRoutes(list) {
        const grid = document.getElementById('routes-grid');
        const noRes = document.getElementById('no-results');
        const countEl = document.getElementById('count-label');
        grid.innerHTML = '';
        countEl.textContent = list.length + ' route' + (list.length !== 1 ? 's' : '');
        if (!list.length) { noRes.style.display = 'block'; return; }
        noRes.style.display = 'none';
        list.forEach(r => {
            const el = document.createElement('div');
            el.className = 'route-card' + (activeRouteId === r.id ? ' active' : '');
            el.dataset.id = r.id;
            el.innerHTML = `
                <div class="route-info">
                    <div class="route-name">${r.name}</div>
                    <div class="route-meta">
                        <span class="category-badge badge-${r.category}">${r.categoryLabel}</span>
                    </div>
                </div>
                <button class="view-btn">View route</button>
            `;
            el.addEventListener('click', () => openMap(r.id));
            grid.appendChild(el);
        });
    }

    // ---- Filter / Search ----
    let activeFilter = 'all';

    function filtered() {
        const q = document.getElementById('search').value.toLowerCase().trim();
        return routes.filter(r =>
            (activeFilter === 'all' || r.category === activeFilter) &&
            (!q || r.name.toLowerCase().includes(q))
        );
    }

    document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        renderRoutes(filtered());
    }));

    document.getElementById('search').addEventListener('input', () => renderRoutes(filtered()));

    // ---- Map ----
    function openMap(routeId) {
        const route = routes.find(r => r.id === routeId);
        if (!route) return;
        activeRouteId = routeId;

        document.getElementById('panel-title').textContent = route.name;
        const badge = document.getElementById('panel-badge');
        badge.className = 'category-badge badge-' + route.category;
        badge.textContent = route.categoryLabel;

        document.getElementById('stat-distance').innerHTML = '&mdash;';
        document.getElementById('stat-elevation').innerHTML = '&mdash;';

        const overlay = document.getElementById('map-overlay');
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
        window.history.replaceState(null, '', '#' + routeId);

        // Show loading, hide map div
        document.getElementById('map-loading').style.display = 'flex';
        document.getElementById('map-loading').textContent = 'Loading map\u2026';
        const mapEl = document.getElementById('map');
        mapEl.style.height = '55vh';

        setTimeout(() => {
            if (map) { map.remove(); map = null; }

            map = L.map('map', { zoomControl: true });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            }).addTo(map);

            new L.GPX(route.gpx, {
                async: true,
                marker_options: { startIconUrl: null, endIconUrl: null, shadowUrl: null },
                polyline_options: { color: '#f5a623', weight: 4, opacity: 0.92, lineCap: 'round', lineJoin: 'round' }
            })
            .on('loaded', function(e) {
                document.getElementById('map-loading').style.display = 'none';
                map.fitBounds(e.target.getBounds(), { padding: [24, 24] });
                const d = e.target.get_distance();
                const el = e.target.get_elevation_gain();
                if (d) document.getElementById('stat-distance').textContent = (d/1000).toFixed(1) + ' km';
                if (el) document.getElementById('stat-elevation').textContent = Math.round(el) + ' m';
            })
            .on('error', function() {
                document.getElementById('map-loading').textContent = 'Could not load route.';
            })
            .addTo(map);
        }, 320);

        document.querySelectorAll('.route-card').forEach(c =>
            c.classList.toggle('active', c.dataset.id === routeId));
    }

    function closeMap() {
        document.getElementById('map-overlay').classList.remove('open');
        document.body.style.overflow = '';
        window.history.replaceState(null, '', window.location.pathname);
        activeRouteId = null;
        document.querySelectorAll('.route-card').forEach(c => c.classList.remove('active'));
        setTimeout(() => { if (map) { map.remove(); map = null; } }, 300);
        renderRoutes(filtered());
    }

    document.getElementById('map-overlay').addEventListener('click', e => {
        if (e.target === document.getElementById('map-overlay')) closeMap();
    });
    document.getElementById('close-btn').addEventListener('click', closeMap);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMap(); });

    function copyLink() {
        navigator.clipboard.writeText(window.location.href).then(() => {
            const btn = document.getElementById('share-btn');
            btn.classList.add('copied');
            btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> Copy link';
            }, 2000);
        });
    }

    // ---- Init ----
    renderRoutes(filtered());
    const hash = window.location.hash.slice(1);
    if (hash && routes.find(r => r.id === hash)) setTimeout(() => openMap(hash), 150);
    </script>
