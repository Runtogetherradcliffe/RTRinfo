<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Runs — Run Together Radcliffe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0a0a0a;color:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.7;font-weight:300;padding:2rem;min-height:100vh;}
        .container{max-width:720px;margin:0 auto;padding:2rem 0;}
        .back-link{color:#555;font-size:.9rem;text-decoration:none;display:inline-flex;align-items:center;gap:.35rem;margin-bottom:1.5rem;transition:color .2s;}
        .back-link:hover{color:#f5a623;}
        h1{font-size:1.8rem;font-weight:500;letter-spacing:-.02em;margin-bottom:.4rem;}
        .tagline{color:#888;font-size:.95rem;margin-bottom:2.5rem;}
        a{color:#f5a623;text-decoration:none;transition:color .2s;}
        a:hover{color:#ffc966;}

        .loading{text-align:center;padding:3rem 0;color:#555;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:.6rem;}
        .spinner{width:18px;height:18px;border:2px solid #333;border-top-color:#f5a623;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
        @keyframes spin{to{transform:rotate(360deg);}}
        .error{text-align:center;padding:3rem 0;color:#555;font-size:.95rem;}

        .week-card{background:#111;border:1px solid #1a1a1a;border-left:3px solid #f5a623;border-radius:0 12px 12px 0;padding:1.25rem 1.5rem;margin-bottom:1.25rem;}
        .week-card.on-tour{border-left-color:#ffc966;background:linear-gradient(135deg,#1a1510 0%,#111 100%);}
        .week-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.75rem;}
        .week-date{font-size:1.15rem;font-weight:500;}
        .week-time{color:#555;font-size:.85rem;margin-top:.1rem;}
        .on-tour-badge{background:#1a1510;border:1px solid #f5a623;color:#f5a623;font-size:.72rem;font-weight:500;padding:.2rem .6rem;border-radius:20px;white-space:nowrap;flex-shrink:0;margin-left:.75rem;text-transform:uppercase;letter-spacing:.05em;}
        .special-note{color:#f5a623;font-size:.875rem;margin-bottom:.6rem;font-style:italic;}
        .meeting-location{display:flex;align-items:center;gap:.4rem;color:#888;font-size:.875rem;margin-bottom:1rem;}
        .meeting-location svg{flex-shrink:0;color:#555;}

        .routes-pair{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
        .route-box{background:#0d0d0d;border:1px solid #222;border-radius:8px;padding:.875rem 1rem;display:flex;flex-direction:column;gap:.4rem;}
        .route-box.faded{opacity:.25;}
        .terrain-badge{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:.15rem .5rem;border-radius:8px;align-self:flex-start;}
        .badge-trail{background:#0d1a0d;color:#7cb87c;border:1px solid #1a3a1a;}
        .badge-road{background:#0d1221;color:#6b9fd4;border:1px solid #1a2a44;}
        .badge-mixed{background:#1a1208;color:#d4a84b;border:1px solid #3a2a0a;}
        .route-name{font-size:.92rem;color:#fff;line-height:1.4;flex:1;}
        .route-links{display:flex;gap:.5rem;margin-top:.35rem;flex-wrap:wrap;}
        .btn-strava,.btn-map{display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;padding:.25rem .6rem;border-radius:5px;border:1px solid;transition:all .2s;white-space:nowrap;}
        .btn-strava{color:#fc4c02;border-color:#3a1a0a;background:#1a0d05;}
        .btn-strava:hover{background:#2a1208;border-color:#fc4c02;color:#fc4c02;}
        .btn-map{color:#f5a623;border-color:#2a2a2a;background:transparent;}
        .btn-map:hover{border-color:#f5a623;background:#1a1510;color:#f5a623;}

        .book-tip{background:#0d1a0d;border:1px solid #1a3a1a;border-radius:8px;padding:.875rem 1.25rem;color:#7cb87c;font-size:.875rem;margin-top:.25rem;}
        .book-tip a{color:#7cb87c;text-decoration:underline;}
        footer{text-align:center;padding-top:2rem;margin-top:3rem;border-top:1px solid #1a1a1a;color:#555;font-size:.85rem;}

        @media(max-width:520px){
            body{padding:1rem;}
            h1{font-size:1.5rem;}
            .routes-pair{grid-template-columns:1fr;}
            .week-card{padding:1rem 1.1rem;}
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <a href="index.html" class="back-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            Run Together Radcliffe
        </a>
        <h1>Upcoming Runs</h1>
        <p class="tagline">Every Thursday &middot; 7pm &middot; Free &middot; All welcome</p>
    </header>

    <div id="schedule"><div class="loading"><div class="spinner"></div> Loading schedule&hellip;</div></div>

    <div class="book-tip">
        &#128155; Book your place via the
        <a href="https://apps.apple.com/gb/app/runtogether-runner/id1447488812" target="_blank" rel="noopener">RunTogether app</a>
        &mdash; or <a href="https://play.google.com/store/apps/details?id=com.sportlabs.android.runner" target="_blank" rel="noopener">Google Play</a>
    </div>

    <footer>
        <p>Run Together Radcliffe &mdash; Part of the
        <a href="https://runtogether.co.uk" target="_blank" rel="noopener">England Athletics Run Together</a> programme</p>
    </footer>
</div>
<script>
const SHEET_ID =  + SHEET_ID + ;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// Timeout — fall back gracefully if gviz doesn't respond
const timeout = setTimeout(() => {
    document.getElementById('schedule').innerHTML =
        '<p class="error">Couldn't load the schedule. <a href="https://runtogetherradcliffe.github.io/weeklyschedule/">Try the full schedule page</a>.</p>';
}, 8000);

// JSONP — no CORS, no fetch, just a script tag
window.__scheduleData = function(data) {
    clearTimeout(timeout);
    try { render(data); } catch(e) { console.error(e); }
};

(function() {
    const s = document.createElement('script');
    s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
            '/gviz/tq?tqx=out:json;responseHandler:__scheduleData&sheet=Schedule';
    s.onerror = function() {
        clearTimeout(timeout);
        document.getElementById('schedule').innerHTML =
            '<p class="error">Couldn't load the schedule.</p>';
    };
    document.head.appendChild(s);
})();

function render(data) {
    const cols = data.table.cols;
    const ci = {};
    cols.forEach((c, i) => { if (c.label) ci[c.label] = i; });

    function g(row, label) {
        const i = ci[label];
        return (i !== undefined && row.c[i]) ? row.c[i].v : null;
    }

    function parseDate(s) {
        const m = (s||'').match(/Date\((\d+),(\d+),(\d+)/);
        return m ? new Date(+m[1], +m[2], +m[3]) : null;
    }

    const today = new Date(); today.setHours(0,0,0,0);

    const weeks = (data.table.rows || [])
        .map(row => {
            const d = parseDate(g(row, 'Date (Thu)'));
            if (!d || d < today) return null;
            const r1 = g(row, 'Route 1 - Name');
            if (!r1 || r1 === 'No run') return null;
            return {
                date:      d,
                r1Name:    r1,
                r1Terrain: g(row, 'Route 1 - Terrain (Road/Trail/Mixed)') || '',
                r1Dist:    g(row, 'Route 1 - Distance (km)'),
                r1Strava:  g(row, 'Route 1 - Route Link (Source URL)') || '',
                r1Rtr:     g(row, '8k RTR page') || '',
                r2Name:    g(row, 'Route 2 - Name') || '',
                r2Terrain: g(row, 'Route 2 - Terrain (Road/Trail/Mixed)') || '',
                r2Dist:    g(row, 'Route 2 - Distance (km)'),
                r2Strava:  g(row, 'Route 2 - Route Link (Source URL)') || '',
                r2Rtr:     g(row, '5k RTR page') || '',
                notes:     g(row, 'Notes') || '',
            };
        })
        .filter(Boolean)
        .slice(0, 4);

    if (!weeks.length) {
        document.getElementById('schedule').innerHTML = '<p class="error">No upcoming runs scheduled yet.</p>';
        return;
    }
    document.getElementById('schedule').innerHTML = weeks.map(renderWeek).join('');
}

function parseNotes(notes) {
    const parts = notes.split('|').map(p => p.trim()).filter(Boolean);
    let special = '', meeting = 'Radcliffe Market', onTour = false;
    parts.forEach(p => {
        if (p.toLowerCase().startsWith('meeting:')) { const m = p.slice(8).trim(); meeting = m[0].toUpperCase() + m.slice(1); }
        else if (p.toLowerCase() === 'rtr on tour') onTour = true;
        else if (p) special = p;
    });
    return { special, meeting, onTour };
}

function terrainLabel(t, d) {
    const tl = (t||'').toLowerCase();
    const dist = d ? d + 'k' : '';
    if (tl==='trail') return 'Trail ' + dist;
    if (tl==='road')  return 'Road '  + dist;
    return (t + ' ' + dist).trim();
}

function badgeClass(t) {
    const tl = (t||'').toLowerCase();
    return tl==='trail' ? 'badge-trail' : tl==='road' ? 'badge-road' : 'badge-mixed';
}

function fmtDate(d) { return 'Thursday ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }

const PIN  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
const STRAVA_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7 13.828h4.169"/></svg>';
const EXT  = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
const ARR  = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>';

function routeBox(name, terrain, dist, stravaUrl, rtrUrl) {
    if (!name) return '<div class="route-box faded"><div class="route-name">&mdash;</div></div>';
    const isInternal = rtrUrl && rtrUrl.includes('routes.html');
    const mapBtn  = rtrUrl  ? `<a class="btn-map"    href="${rtrUrl}"${isInternal ? '' : ' target="_blank" rel="noopener"'}>View map ${ARR}</a>` : '';
    const strBtn  = stravaUrl && stravaUrl.startsWith('http')
        ? `<a class="btn-strava" href="${stravaUrl}" target="_blank" rel="noopener">${STRAVA_ICON} Strava ${EXT}</a>` : '';
    const links = (strBtn || mapBtn) ? `<div class="route-links">${strBtn}${mapBtn}</div>` : '';
    return `<div class="route-box">
        <span class="terrain-badge ${badgeClass(terrain)}">${terrainLabel(terrain, dist)}</span>
        <div class="route-name">${name}</div>
        ${links}
    </div>`;
}

function renderWeek(w) {
    const n = parseNotes(w.notes);
    return `<div class="week-card${n.onTour ? ' on-tour' : ''}">
        <div class="week-header">
            <div>
                <div class="week-date">${fmtDate(w.date)}</div>
                <div class="week-time">7:00pm &ndash; 8:00pm</div>
            </div>
            ${n.onTour ? '<span class="on-tour-badge">On tour</span>' : ''}
        </div>
        ${n.special ? `<div class="special-note">${n.special}</div>` : ''}
        <div class="meeting-location">${PIN} ${n.meeting}</div>
        <div class="routes-pair">
            ${routeBox(w.r1Name, w.r1Terrain, w.r1Dist, w.r1Strava, w.r1Rtr)}
            ${routeBox(w.r2Name, w.r2Terrain, w.r2Dist, w.r2Strava, w.r2Rtr)}
        </div>
    </div>`;
}
</script>
</body>
</html>
