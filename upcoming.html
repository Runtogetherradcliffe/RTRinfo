            font-weight: 300;
            padding: 2rem;
            min-height: 100vh;
        }

        .container { max-width: 720px; margin: 0 auto; padding: 2rem 0; }

        .back-link {
            color: #555; font-size: 0.9rem; text-decoration: none;
            display: inline-flex; align-items: center; gap: 0.35rem;
            margin-bottom: 1.5rem; transition: color 0.2s;
        }
        .back-link:hover { color: #f5a623; }

        .tagline { color: #888; font-size: 0.95rem; margin-bottom: 2.5rem; }

        a { color: #f5a623; text-decoration: none; transition: color 0.2s; }
        a:hover { color: #ffc966; }

        /* Loading / error */
        .loading, .empty, .error {
            text-align: center; padding: 3rem 0; color: #555; font-size: 0.95rem;
        }
        .loading::after {
            content: ''; display: inline-block; width: 18px; height: 18px;
            border: 2px solid #333; border-top-color: #f5a623;
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-left: 0.5rem; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Week cards */
        .week-card {
            background: #111;
            border: 1px solid #1a1a1a;
            border-left: 3px solid #f5a623;
            border-radius: 0 12px 12px 0;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.25rem;
            transition: border-color 0.2s;
        }
        .week-card.on-tour {
            border-left-color: #ffc966;
            background: linear-gradient(135deg, #1a1510 0%, #111 100%);
        }

        .week-header {
            display: flex; justify-content: space-between;
            align-items: flex-start; margin-bottom: 0.75rem;
        }
        .week-date { font-size: 1.15rem; font-weight: 500; color: #fff; }
        .week-time { color: #555; font-size: 0.85rem; margin-top: 0.1rem; }

        .on-tour-badge {
            background: #1a1510; border: 1px solid #f5a623;
            color: #f5a623; font-size: 0.75rem; font-weight: 500;
            padding: 0.2rem 0.6rem; border-radius: 20px;
            white-space: nowrap; flex-shrink: 0; margin-left: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.05em;
        }

        .special-note {
            color: #f5a623; font-size: 0.875rem; margin-bottom: 0.6rem;
            font-style: italic;
        }

        .meeting-location {
            display: flex; align-items: center; gap: 0.4rem;
            color: #888; font-size: 0.875rem; margin-bottom: 1rem;
        }
        .meeting-location svg { flex-shrink: 0; color: #555; }

        /* Route sub-cards */
        .routes-pair {
            display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;
        }

        .route-box {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 0.875rem 1rem;
            display: flex; flex-direction: column; gap: 0.4rem;
        }

        .terrain-badge {
            font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.07em; padding: 0.15rem 0.5rem;
            border-radius: 8px; align-self: flex-start;
        }
        .badge-trail { background: #0d1a0d; color: #7cb87c; border: 1px solid #1a3a1a; }
        .badge-road  { background: #0d1221; color: #6b9fd4; border: 1px solid #1a2a44; }
        .badge-mixed { background: #1a1208; color: #d4a84b; border: 1px solid #3a2a0a; }

        .route-name {
            font-size: 0.92rem; font-weight: 400; color: #fff;
            line-height: 1.4; flex: 1;
        }

        .view-route-link {
            font-size: 0.8rem; color: #f5a623; margin-top: 0.25rem;
            display: inline-flex; align-items: center; gap: 0.2rem;
            transition: color 0.2s;
        }
        .view-route-link:hover { color: #ffc966; }

        /* Book tip */
        .book-tip {
            background: #0d1a0d; border: 1px solid #1a3a1a;
            border-radius: 8px; padding: 0.875rem 1.25rem;
            color: #7cb87c; font-size: 0.875rem; margin-top: 0.5rem;

            border-top: 1px solid #1a1a1a; color: #555; font-size: 0.85rem;
        }

        @media (max-width: 520px) {
            body { padding: 1rem; }
            h1 { font-size: 1.5rem; }
            .routes-pair { grid-template-columns: 1fr; }
            .week-card { padding: 1rem 1.1rem; }
        }

// Build name -> route id lookup
function normName(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
}
const routeMap = {};
routes.forEach(r => { routeMap[normName(r.name)] = r.id; });

function getRouteUrl(name, fallback) {
    if (!name) return fallback || null;
    const id = routeMap[normName(name)];
    return id ? ROUTES_BASE + id : (fallback || null);
}

function parseGvizDate(str) {
    if (!str) return null;
    const m = str.match(/Date\((\d+),(\d+),(\d+)/);
    return m ? new Date(+m[1], +m[2], +m[3]) : null;
}

function parseNotes(notes) {
    if (!notes) return { special: null, meeting: 'Radcliffe Market', onTour: false, mapUrl: null };
    const parts = notes.split(' | ').map(p => p.trim()).filter(Boolean);
    let special = null, meeting = 'Radcliffe Market', onTour = false;
    parts.forEach(p => {
        if (p.toLowerCase().startsWith('meeting:')) meeting = p.slice(8).trim();
        else if (p.toLowerCase() === 'rtr on tour') onTour = true;
        else if (p) special = p;
    });
    // Capitalise meeting location first letter
    meeting = meeting.charAt(0).toUpperCase() + meeting.slice(1);
    return { special, meeting, onTour };
}

    const t = (terrain || '').toLowerCase();
    const d = dist ? dist + 'k' : '';
    if (t === 'trail') return 'Trail ' + d;
    if (t === 'road')  return 'Road ' + d;
    return ((terrain || '') + ' ' + d).trim();
}

function badgeClass(terrain) {
    const t = (terrain || '').toLowerCase();
    if (t === 'trail') return 'badge-trail';
    if (t === 'road')  return 'badge-road';
    return 'badge-mixed';
}

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDate(d) {
    return 'Thursday ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
}

function renderRouteBox(name, terrain, dist, fallbackUrl) {
    if (!name) return '<div class="route-box" style="opacity:0.3"><div class="route-name" style="color:#555">—</div></div>';
    const url = getRouteUrl(name, fallbackUrl);
    const isInternal = url && url.includes('routes.html');
    return `<div class="route-box">
        <span class="terrain-badge ${badgeClass(terrain)}">${terrainLabel(terrain, dist)}</span>
        <div class="route-name">${name}</div>
        ${url ? `<a class="view-route-link" href="${url}"${isInternal ? '' : ' target="_blank" rel="noopener"'}>
            View route
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </a>` : ''}
    </div>`;
}

function renderWeek(w) {
    const { date, r1Name, r1Terrain, r1Dist, r1Url, r2Name, r2Terrain, r2Dist, r2Url, notes } = w;
    const { special, meeting, onTour } = parseNotes(notes);
    return `<div class="week-card${onTour ? ' on-tour' : ''}">
        <div class="week-header">
            <div>
                <div class="week-date">${fmtDate(date)}</div>
                <div class="week-time">7:00pm &ndash; 8:00pm</div>
            </div>
            ${onTour ? '<span class="on-tour-badge">On tour</span>' : ''}
        </div>
        ${special ? `<div class="special-note">${special}</div>` : ''}
        <div class="meeting-location">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>
            ${meeting}
        </div>
        <div class="routes-pair">
            ${renderRouteBox(r1Name, r1Terrain, r1Dist, r1Url)}
            ${renderRouteBox(r2Name, r2Terrain, r2Dist, r2Url)}
        </div>
    </div>`;
}

async function loadSchedule() {
    const el = document.getElementById('schedule');
    try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Schedule`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        // Strip JSONP wrapper
        const json = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));

        const cols = json.table.cols;
        const ci = label => cols.findIndex(c => c.label === label);

        const today = new Date(); today.setHours(0,0,0,0);

        const weeks = (json.table.rows || [])
            .map(row => {
                const g = label => { const i = ci(label); return i >= 0 ? (row.c[i]?.v ?? null) : null; };
                const dateV = g('Date (Thu)');
                if (!dateV) return null;
                const date = parseGvizDate(dateV);
                if (!date || date < today) return null;
                const r1Name = g('Route 1 - Name');
                if (!r1Name || r1Name === 'No run') return null;
                return {
                    date,
                    r1Name, r1Terrain: g('Route 1 - Terrain (Road/Trail/Mixed)'),
                    r1Dist: g('Route 1 - Distance (km)'), r1Url: g('Route 1 - Route Link (Source URL)'),
                    r2Name: g('Route 2 - Name'), r2Terrain: g('Route 2 - Terrain (Road/Trail/Mixed)'),
                    r2Dist: g('Route 2 - Distance (km)'), r2Url: g('Route 2 - Route Link (Source URL)'),
                    notes: g('Notes'),
                };
            })
            .filter(Boolean)
            .slice(0, 4);

        if (!weeks.length) {
            el.innerHTML = '<p class="empty">No upcoming runs in the schedule yet.</p>';
            return;
        }
        el.innerHTML = weeks.map(renderWeek).join('');
    } catch(e) {
        el.innerHTML = '<p class="error">Couldn't load the schedule right now. <a href="https://runtogetherradcliffe.github.io/weeklyschedule/">Try the full schedule page</a>.</p>';
        console.error(e);
    }
}

loadSchedule();
</script>
